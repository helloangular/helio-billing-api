# Helio central template: deploy to every environment the Helio Environment
# Catalog approved for this repository. Helio maintains the repository
# variable HELIO_ENVIRONMENTS ({"order":[stages], "<stage>":[environments],
# "runs_on":{environment: runner}}). Stages run in order; environments within
# a stage run in parallel. Each job targets one GitHub environment, so that
# environment's protection (Helio reviewer + break-glass reviewers) applies.
name: helio-fanout-deploy (template)

on:
  workflow_call:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      # Set by Helio for a redeploy or rollback of one environment; empty for
      # releases and pushes, which fan out to the whole approved plan.
      helio_target_environment:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  qa:
    if: ${{ vars.HELIO_ENVIRONMENTS != '' && contains(fromJSON(vars.HELIO_ENVIRONMENTS).order, 'qa') && (inputs.helio_target_environment == '' || contains(fromJSON(vars.HELIO_ENVIRONMENTS).qa, inputs.helio_target_environment)) }}
    name: qa (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ inputs.helio_target_environment != '' && fromJSON(format('["{0}"]', inputs.helio_target_environment)) || fromJSON(vars.HELIO_ENVIRONMENTS).qa }}
    environment: ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.HELIO_ENVIRONMENTS).runs_on[matrix.environment] }}
    concurrency:
      group: helio-env-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          TARGET: ${{ vars.HELIO_ENVIRONMENT }}
          STAGE: ${{ vars.HELIO_STAGE }}
          KIND: ${{ vars.HELIO_TARGET_KIND }}
        run: echo "Deploying ${GITHUB_SHA} to ${TARGET} (stage ${STAGE}, ${KIND})"

  preprod:
    needs: [qa]
    if: ${{ !failure() && !cancelled() && vars.HELIO_ENVIRONMENTS != '' && contains(fromJSON(vars.HELIO_ENVIRONMENTS).order, 'preprod') && (inputs.helio_target_environment == '' || contains(fromJSON(vars.HELIO_ENVIRONMENTS).preprod, inputs.helio_target_environment)) }}
    name: preprod (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ inputs.helio_target_environment != '' && fromJSON(format('["{0}"]', inputs.helio_target_environment)) || fromJSON(vars.HELIO_ENVIRONMENTS).preprod }}
    environment: ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.HELIO_ENVIRONMENTS).runs_on[matrix.environment] }}
    concurrency:
      group: helio-env-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          TARGET: ${{ vars.HELIO_ENVIRONMENT }}
          STAGE: ${{ vars.HELIO_STAGE }}
          KIND: ${{ vars.HELIO_TARGET_KIND }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          echo "Deploying ${GITHUB_SHA} to ${TARGET} (stage ${STAGE}, ${KIND})"
          if [ "${KIND}" = "aws" ]; then echo "Would assume ${AWS_ROLE_ARN} in ${AWS_ACCOUNT_ID}/${AWS_REGION} via OIDC"; fi

  production:
    needs: [preprod]
    if: ${{ !failure() && !cancelled() && vars.HELIO_ENVIRONMENTS != '' && contains(fromJSON(vars.HELIO_ENVIRONMENTS).order, 'production') && (inputs.helio_target_environment == '' || contains(fromJSON(vars.HELIO_ENVIRONMENTS).production, inputs.helio_target_environment)) }}
    name: production (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ inputs.helio_target_environment != '' && fromJSON(format('["{0}"]', inputs.helio_target_environment)) || fromJSON(vars.HELIO_ENVIRONMENTS).production }}
    environment: ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.HELIO_ENVIRONMENTS).runs_on[matrix.environment] }}
    concurrency:
      group: helio-env-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          TARGET: ${{ vars.HELIO_ENVIRONMENT }}
        run: echo "Deploying ${GITHUB_SHA} to ${TARGET}"
