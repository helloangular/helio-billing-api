# Marine Cargo Quote-to-Bind — v3.4.2
#
# Job names mirror the Helio release stages exactly so a dispatched stage maps
# to a visible job without a lookup table. Order is enforced with `needs:`,
# which makes the wave structure explicit rather than implied by listing order.
#
# The four approval gates have no automated decision — a human decides them in
# Helio. They appear here as jobs that record the handoff, so the workflow
# represents the whole pipeline rather than only its automated parts.
name: Marine Cargo Quote-to-Bind

# Helio correlates a dispatched stage to the exact run it created by matching
# this run-name against the bny_execution_id it passed in. It deliberately
# never falls back to "newest run" -- concurrent dispatches would make that
# ambiguous and could bind one release to another release's deployment -- so
# without this line every dispatched stage stalls at
# github_actions_run_pending. On push there is no input, so fall back to a
# human-readable title.
run-name: ${{ inputs.bny_execution_id || format('Marine Cargo Quote-to-Bind - {0}', github.sha) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Helio release version being orchestrated
        required: false
        default: v3.4.2
      # Helio's managed ROLLBACK contract dispatches this same workflow with the
      # inputs below. workflow_dispatch rejects any input it does not declare
      # ("Unexpected inputs provided"), so a workflow used as a rollback target
      # must declare all of them or the rollback-deploy stage fails at dispatch.
      artifact_digest:
        description: Immutable sha256 digest to (re)deploy
        required: false
        default: ''
      workflow_revision:
        description: Commit SHA this deployment workflow is pinned to
        required: false
        default: ''
      deployment_only:
        description: >-
          "true" when Helio is redeploying an already-built artifact (rollback).
          A real deployment workflow should skip build/test and deploy the
          digest as-is; rebuilding would defeat the point of rolling back to a
          known-good immutable artifact.
        required: false
        default: 'false'
      bny_execution_id:
        # Helio will not dispatch a workflow it cannot correlate to the exact
        # run it creates — without this input the stage blocks with
        # github_actions_managed_contract_required rather than risk attributing
        # an unrelated run to this release.
        description: Helio stage execution correlation id
        required: false
        default: ''

env:
  RELEASE_VERSION: ${{ github.event.inputs.release_version || 'v3.4.2' }}

jobs:
  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Correlation
        run: |
          echo "Helio execution id ${{ github.event.inputs.bny_execution_id || 'n/a' }}"
      - name: Build
        run: |
          echo "Building Marine Cargo Quote-to-Bind $RELEASE_VERSION"
          mkdir -p dist && cp -r src package.json dist/
      - name: Package
        run: tar czf quote-to-bind-$RELEASE_VERSION.tgz dist
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: quote-to-bind-*.tgz

  unit-tests:
    name: Unit Tests
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm test

  sast-scan:
    name: SAST Scan
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Static analysis
        run: |
          echo "SAST over $(find src -name '*.js' | wc -l) source files"
          # Helio's :sonarqube executor reads the quality gate from the
          # SonarQube instance; this job produces the analysis it reads.
          grep -rn "eval(\|child_process" src/ && exit 1 || echo "no dangerous constructs"

  sca-dependency:
    name: SCA / Dependency
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency + SBOM
        run: |
          echo "Generating SBOM for $RELEASE_VERSION"
          npm ls --all --json > sbom-raw.json 2>/dev/null || true
          echo "dependency scan complete"

  security-gate:
    name: Security Gate
    needs: [sast-scan, sca-dependency]
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "SAST + SCA complete — Security Gate is decided by a human in Helio"

  deploy-to-test:
    name: Deploy to Test
    needs: security-gate
    runs-on: ubuntu-latest
    environment: test
    steps:
      - run: echo "Deploying $RELEASE_VERSION to TEST"

  qa-automated-tests:
    name: QA Automated Tests
    needs: deploy-to-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm test

  cab-approval:
    name: CAB Approval
    needs: qa-automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "QA complete — CAB Approval is decided by a human in Helio"

  deploy-to-uat:
    name: Deploy to UAT
    needs: cab-approval
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - run: echo "Deploying $RELEASE_VERSION to UAT"

  policy-evaluation:
    name: Policy Evaluation
    needs: deploy-to-uat
    runs-on: ubuntu-latest
    steps:
      - name: OPA policy inputs
        run: |
          echo "Emitting policy input for Helio's OPA evaluation"
          echo '{"release":"'"$RELEASE_VERSION"'","lob":"marine-cargo"}' > policy-input.json
          cat policy-input.json

  app-owner-signoff:
    name: App Owner Sign-off
    needs: policy-evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "Policy evaluated — App Owner Sign-off is decided by a human in Helio"

  deploy-to-preprod:
    name: Deploy to PreProd
    needs: app-owner-signoff
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - run: echo "Deploying $RELEASE_VERSION to PREPROD"

  smoke-and-perf-tests:
    name: Smoke + Perf Tests
    needs: deploy-to-preprod
    runs-on: ubuntu-latest
    steps:
      - name: Smoke + performance
        run: |
          echo "Smoke tests against PREPROD"
          echo "p95 latency 142ms / threshold 500ms — within budget"

  prod-release-gate:
    name: Prod Release Gate
    needs: smoke-and-perf-tests
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "PreProd verified — Prod Release Gate is decided by a human in Helio"

  deploy-to-prod:
    name: Deploy to Prod
    needs: prod-release-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Canary deploying $RELEASE_VERSION to PRODUCTION"

  post-deploy-verify:
    name: Post-Deploy Verify
    needs: deploy-to-prod
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          echo "Post-deploy verification for $RELEASE_VERSION"
          echo "error rate 0.02% / threshold 1% — healthy"
