# Billing API — governed CD pipeline
#
# Every stage does real work. Unit tests run on GitHub-hosted runners; the
# on-premise runner (labels: self-hosted, helio-tomcat) runs the stages that
# need on-premise systems: the build (publishes to the internal Nexus),
# SonarQube SAST, Trivy SCA, OPA policy evaluation and the Apache Tomcat
# environments test / uat / preprod / prod. Every deploy resolves from Nexus.
#
#   build-and-package → unit-tests → sast-scan ─┐
#                                 → sca-dependency ┘→ security-gate → deploy-to-test
#   → qa-automated-tests → cab-approval → deploy-to-uat → policy-evaluation
#   → app-owner-signoff → deploy-to-preprod → smoke-and-perf-tests
#   → prod-release-gate → deploy-to-prod → post-deploy-verify
#
# Helio dispatches each provider stage as its own correlated run
# (helio_stage_id) and decides the four human gates. For an uninterrupted
# provider-owned run, use billing-api-native.yml instead.
name: Billing API

# Helio correlates a dispatched stage to the exact run it created by matching
# this run-name against the helio_execution_id it passed in. It never falls
# back to "newest run", so without this line every dispatched stage would
# stall at github_actions_run_pending.
run-name: ${{ inputs.helio_execution_id || format('Billing API - {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Helio release version being orchestrated (default: derived from the commit)"
        required: false
        default: ''
      artifact_digest:
        description: Immutable sha256 digest to (re)deploy
        required: false
        default: ''
      workflow_revision:
        description: Commit SHA this deployment workflow is pinned to
        required: false
        default: ''
      deployment_only:
        description: >-
          "true" when Helio is redeploying an already-built artifact (rollback):
          the build is skipped and the pinned digest is installed as-is.
        required: false
        default: 'false'
      helio_execution_id:
        description: Helio stage execution correlation id
        required: false
        default: ''
      helio_release_id:
        description: Helio release UUID
        required: false
        default: ''
      helio_stage_id:
        description: Immutable Helio logical stage id to execute
        required: false
        default: ''

# Publishing deployment evidence is a write: Helio reads that record back as
# the provider-authored proof that this run deployed this artifact.
permissions:
  contents: read
  actions: read

env:
  # Versions are immutable in Nexus, so an unversioned run gets a commit-derived one.
  RELEASE_VERSION: ${{ inputs.release_version || format('v3.4.2-{0}', github.sha) }}
  RELEASE_KEY: ${{ inputs.helio_release_id || github.run_id }}
  # Deployment target and artifact registry as seen from the on-premise runner.
  # Override per repository (Settings > Variables); the defaults are the demo host.
  ONPREM_TOMCAT: ${{ vars.ONPREM_TOMCAT || 'http://127.0.0.1:8080' }}
  NEXUS_URL: ${{ vars.NEXUS_URL || 'http://127.0.0.1:8081' }}

jobs:
  build-and-package:
    name: Build & Package
    if: ${{ inputs.helio_execution_id != '' && inputs.helio_stage_id == 'build-and-package' }}
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" build-and-package false
      - name: Build
        run: |
          echo "Building Billing API $RELEASE_VERSION"
          mvn --batch-mode -Drelease.version="$RELEASE_VERSION" clean package
      - name: Record artifact digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(shasum -a 256 target/billing-api.war | awk '{print $1}')"
          echo "artifact_digest=sha256:$digest" >> "$GITHUB_OUTPUT"
          echo "WAR digest sha256:$digest"
      - name: Publish the WAR to the on-premise Nexus repository (artifact system of record)
        id: publish
        run: scripts/publish-artifact.sh "$RELEASE_VERSION" target/billing-api.war
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows binaries to leave the boundary.
        if: ${{ vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: package-${{ env.RELEASE_KEY }}
          path: target/billing-api.war
          retention-days: 90
    outputs:
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}

  unit-tests:
    name: Unit Tests
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'unit-tests' }}
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" unit-tests false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20' }
      - name: Java and JavaScript unit tests
        run: mvn --batch-mode test && npm test

  sast-scan:
    name: SAST Scan
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'sast-scan' }}
    needs: unit-tests
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" sast-scan false
      - name: Unit tests with coverage (feeds the quality gate)
        run: |
          mvn --batch-mode -q test
          npm run coverage
      - name: SonarQube analysis and quality gate (on-premise SonarQube)
        id: sonar
        run: scripts/sonar-scan.sh "$RELEASE_VERSION"

  sca-dependency:
    name: SCA / Dependency
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'sca-dependency' }}
    needs: unit-tests
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" sca-dependency false
      - name: Trivy dependency scan and SBOM (on-premise Trivy)
        id: trivy
        run: scripts/sca-scan.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows evidence to leave the boundary.
        if: ${{ always() && vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: sbom-${{ env.RELEASE_KEY }}-${{ github.run_id }}
          path: target/sca
          retention-days: 90

  security-gate:
    name: Security Gate
    # Structural DAG marker only. Helio owns this gate and never dispatches it.
    if: ${{ inputs.helio_execution_id == '' && inputs.helio_stage_id == 'security-gate' }}
    needs: [sast-scan, sca-dependency]
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "SAST + SCA complete — Security Gate is decided by a human in Helio"

  deploy-to-test:
    name: Deploy to Test
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'deploy-to-test' }}
    needs: security-gate
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: test
    concurrency:
      group: billing-api-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" deploy-to-test false
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the TEST context
        env:
          TOMCAT_CONTEXT: billing-api-test
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  qa-automated-tests:
    name: QA Automated Tests
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'qa-automated-tests' }}
    needs: deploy-to-test
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" qa-automated-tests false
      - name: HTTP end-to-end tests against the TEST environment
        env:
          QA_TARGET_URL: ${{ env.ONPREM_TOMCAT }}/billing-api-test
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
        run: npm run qa

  cab-approval:
    name: CAB Approval
    # Structural DAG marker only. Helio owns this gate and never dispatches it.
    if: ${{ inputs.helio_execution_id == '' && inputs.helio_stage_id == 'cab-approval' }}
    needs: qa-automated-tests
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "QA complete — CAB Approval is decided by a human in Helio"

  deploy-to-uat:
    name: Deploy to UAT
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'deploy-to-uat' }}
    needs: cab-approval
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: uat
    concurrency:
      group: billing-api-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" deploy-to-uat false
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the UAT context
        env:
          TOMCAT_CONTEXT: billing-api-uat
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  policy-evaluation:
    name: Policy Evaluation
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'policy-evaluation' }}
    needs: deploy-to-uat
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" policy-evaluation false
      - name: Evaluate the release policy (on-premise OPA, facts from SonarQube, Trivy and UAT)
        id: policy
        run: |
          set -euo pipefail
          digest="$(curl --fail --silent --max-time 5 "$ONPREM_TOMCAT/billing-api-uat/artifact-digest")"
          scripts/opa-policy-check.sh "$digest" "$RELEASE_KEY" preprod "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows evidence to leave the boundary.
        if: ${{ always() && vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: policy-decision-${{ env.RELEASE_KEY }}-${{ github.run_id }}
          path: target/policy
          retention-days: 90

  app-owner-signoff:
    name: App Owner Sign-off
    # Structural DAG marker only. Helio owns this gate and never dispatches it.
    if: ${{ inputs.helio_execution_id == '' && inputs.helio_stage_id == 'app-owner-signoff' }}
    needs: policy-evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "Policy evaluated — App Owner Sign-off is decided by a human in Helio"

  deploy-to-preprod:
    name: Deploy to PreProd
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'deploy-to-preprod' }}
    needs: app-owner-signoff
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: preprod
    concurrency:
      group: billing-api-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" deploy-to-preprod false
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the PREPROD context
        env:
          TOMCAT_CONTEXT: billing-api-preprod
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  smoke-and-perf-tests:
    name: Smoke + Perf Tests
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'smoke-and-perf-tests' }}
    needs: deploy-to-preprod
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" smoke-and-perf-tests false
      - name: Smoke and measured p95 latency against PREPROD
        id: perf
        run: scripts/smoke-perf.sh "$ONPREM_TOMCAT/billing-api-preprod" "$RELEASE_VERSION"

  prod-release-gate:
    name: Prod Release Gate
    # Structural DAG marker only. Helio owns this gate and never dispatches it.
    if: ${{ inputs.helio_execution_id == '' && inputs.helio_stage_id == 'prod-release-gate' }}
    needs: smoke-and-perf-tests
    runs-on: ubuntu-latest
    steps:
      - name: Handoff to Helio approval gate
        run: echo "PreProd verified — Prod Release Gate is decided by a human in Helio"

  deploy-to-prod:
    name: Deploy to Prod
    if: ${{ always() && inputs.helio_execution_id != '' && (inputs.helio_stage_id == 'deploy-to-prod' || inputs.deployment_only == 'true') }}
    needs: [prod-release-gate, build-and-package]
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: production
    # Publishing deployment evidence is a write; only this job may do it.
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" deploy-to-prod "$DEPLOYMENT_ONLY"
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Install exact WAR and restart the production context
        id: deploy
        env:
          TOMCAT_CONTEXT: billing-api
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}" | tee -a "$GITHUB_OUTPUT"

      - name: Bind serving WAR identity
        id: identity
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          DEPLOYED_VERSION: ${{ steps.deploy.outputs.deployed_version }}
        run: |
          set -euo pipefail
          echo "artifact_uri=billing-api-${DEPLOYED_VERSION}.war@${ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"

      # Provider-authored, immutable record of what was deployed. Helio reads
      # this back rather than trusting its own dispatch. Only on a
      # Helio-dispatched run: a push build has no release to bind to.
      - name: Publish immutable release deployment evidence
        if: github.event_name == 'workflow_dispatch' && inputs.helio_execution_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_URI: ${{ steps.identity.outputs.artifact_uri }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api.yml
          WORKFLOW_REVISION: ${{ github.sha }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          PRODUCTION_URL: ${{ env.ONPREM_TOMCAT }}/billing-api/
        run: |
          set -euo pipefail
          # Assert every field before publishing: a malformed record would be
          # read back as proof.
          [[ -n "$HELIO_EXECUTION_ID" ]]
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_WORKFLOW_ID" =~ ^\.github/workflows/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "$WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$DEPLOYMENT_ONLY" == "true" ]]; then
            deployment_task="helio-rollback"
          else
            deployment_task="helio-forward-release"
          fi

          jq -n \
            --arg ref "$GITHUB_SHA" \
            --arg execution_id "$HELIO_EXECUTION_ID" \
            --arg release_id "$HELIO_RELEASE_ID" \
            --arg artifact_uri "$ARTIFACT_URI" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" \
            --arg workflow_revision "$WORKFLOW_REVISION" \
            --arg task "$deployment_task" \
            '{ref:$ref, auto_merge:false, required_contexts:[],
              environment:"production", task:$task,
              payload:{schema_version:1,
                       helio_execution_id:$execution_id,
                       release_id:$release_id,
                       artifact_uri:$artifact_uri,
                       artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id,
                       workflow_revision:$workflow_revision}}' \
            > deployment-evidence.json

          deployment_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input deployment-evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success \
            -f description="Immutable WAR is serving from Apache Tomcat" \
            -f environment_url="$PRODUCTION_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}

  post-deploy-verify:
    name: Post-Deploy Verify
    if: ${{ always() && inputs.helio_execution_id != '' && inputs.helio_stage_id == 'post-deploy-verify' }}
    needs: deploy-to-prod
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governed inputs
        env:
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          HELIO_STAGE_ID: ${{ inputs.helio_stage_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
        run: scripts/validate-governed-inputs.sh "$HELIO_EXECUTION_ID" "$HELIO_RELEASE_ID" "$HELIO_STAGE_ID" "$WORKFLOW_REVISION" "$GITHUB_SHA" post-deploy-verify "$DEPLOYMENT_ONLY"
      - name: Verify production serves the approved artifact
        env:
          EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
        run: |
          set -euo pipefail
          # This stage is its own run: the expected digest is the one Helio pinned,
          # or the one the registry recorded for this release version.
          expected="${EXPECTED_DIGEST:-$(scripts/registry-digest.sh "$RELEASE_VERSION")}"
          # A rollback redeploys an older version: verify the digest only.
          [[ "$DEPLOYMENT_ONLY" == "true" ]] && EXPECTED_VERSION=""
          scripts/verify-deployment.sh "$ONPREM_TOMCAT/billing-api" "$expected" "$EXPECTED_VERSION"
