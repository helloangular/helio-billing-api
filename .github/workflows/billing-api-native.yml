# Billing API — provider-owned CD pipeline (one run)
#
# The same real stages as billing-api.yml, run as ONE GitHub Actions run.
# Helio starts the run once (provider-managed execution mode), then observes
# it: the four human gates are GitHub environment protection rules that call
# Helio's deployment-protection app, and Helio approves or rejects each one
# after the required people sign in Helio.
#
#   build-and-package → unit-tests → sast-scan ─┐
#                                 → sca-dependency ┘→ deploy-to-test → qa-automated-tests
#   → deploy-to-uat → policy-evaluation → deploy-to-preprod → smoke-and-perf-tests
#   → deploy-to-prod → post-deploy-verify
#
# Gate mapping (environment protection rule → Helio gate):
#   test        Security Gate         (1 signature)
#   uat         CAB Approval          (1 signature)
#   preprod     App Owner Sign-off    (1 signature)
#   production  Prod Release Gate     (2 signatures)
# The signature counts are Helio policy, enforced by Helio's deployment
# protection rule on each environment; nothing in this file enforces them.
# Without that rule the environments pass straight through (or use GitHub's
# own required reviewers, which cannot express a two-person rule).
#
# This is a tested reference implementation, not a drop-in production
# workflow: runner label, deployment target, registry and artifact retention
# are repository variables (see SETUP.md). The Helio inputs, run-name and
# evidence step are optional instrumentation; the file runs without Helio.
#
# Unit tests run on GitHub-hosted runners. Everything that must reach the
# internal network runs on the on-premise runner (labels: self-hosted,
# helio-tomcat): the build, which publishes the WAR to the internal Nexus
# repository, SonarQube SAST, Trivy SCA, OPA policy evaluation and the
# Apache Tomcat environments. Every deploy resolves the WAR from Nexus.
name: Billing API (native)

# Helio correlates the run it started by matching this run-name against the
# helio_execution_id it passed in.
run-name: ${{ inputs.helio_execution_id || format('Billing API (native) - {0}', github.sha) }}

# Dispatch only: Helio is the only thing that starts a governed run. Every
# input has a default so the run can also be started by hand for a rehearsal.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Helio release version being orchestrated (default: derived from the commit)"
        required: false
        default: ''
      artifact_digest:
        description: Immutable sha256 digest to (re)deploy
        required: false
        default: ''
      workflow_revision:
        description: Commit SHA this deployment workflow is pinned to
        required: false
        default: ''
      deployment_only:
        description: >-
          "true" when Helio is redeploying an already-built artifact (rollback):
          build, tests, scans and lower environments are skipped and the pinned
          digest is installed into production as-is.
        required: false
        default: 'false'
      helio_execution_id:
        description: Helio execution correlation id for this run
        required: false
        default: ''
      helio_release_id:
        description: Helio release UUID
        required: false
        default: ''

# Publishing deployment evidence is a write: Helio reads that record back as
# the provider-authored proof that this run deployed this artifact.
# One release at a time through the shared environments; a second run queues
# behind the first instead of overwriting an environment it is still validating.
concurrency:
  group: billing-api-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # Versions are immutable in Nexus, so an unversioned run gets a commit-derived one.
  RELEASE_VERSION: ${{ inputs.release_version || format('v3.4.2-{0}', github.sha) }}
  RELEASE_KEY: ${{ inputs.helio_release_id || github.run_id }}
  # Deployment target and artifact registry as seen from the on-premise runner.
  # Override per repository (Settings > Variables); the defaults are the demo host.
  ONPREM_TOMCAT: ${{ vars.ONPREM_TOMCAT || 'http://127.0.0.1:8080' }}
  NEXUS_URL: ${{ vars.NEXUS_URL || 'http://127.0.0.1:8081' }}

jobs:
  build-and-package:
    name: Build & Package
    if: ${{ inputs.deployment_only != 'true' }}
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate governed inputs
        if: inputs.helio_execution_id != ''
        env:
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] \
            || { echo "helio_release_id is required on a governed run" >&2; exit 1; }
          [[ "$WORKFLOW_REVISION" == "$GITHUB_SHA" ]] \
            || { echo "workflow_revision '$WORKFLOW_REVISION' must equal the executing commit $GITHUB_SHA" >&2; exit 1; }
      - name: Build
        run: |
          echo "Building Billing API $RELEASE_VERSION"
          mvn --batch-mode -Drelease.version="$RELEASE_VERSION" clean package
      - name: Record artifact digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(shasum -a 256 target/billing-api.war | awk '{print $1}')"
          echo "artifact_digest=sha256:$digest" >> "$GITHUB_OUTPUT"
          echo "WAR digest sha256:$digest"
      - name: Publish the WAR to the on-premise Nexus repository (artifact system of record)
        id: publish
        run: scripts/publish-artifact.sh "$RELEASE_VERSION" target/billing-api.war
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows binaries to leave the boundary.
        if: ${{ vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: package-${{ env.RELEASE_KEY }}
          path: target/billing-api.war
          retention-days: 90
    outputs:
      artifact_digest: ${{ steps.digest.outputs.artifact_digest }}

  unit-tests:
    name: Unit Tests
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Java and JavaScript unit tests
        run: mvn --batch-mode test && npm test

  sast-scan:
    name: SAST Scan
    needs: unit-tests
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit tests with coverage (feeds the quality gate)
        run: |
          mvn --batch-mode -q test
          npm run coverage
      - name: SonarQube analysis and quality gate (on-premise SonarQube)
        run: scripts/sonar-scan.sh "$RELEASE_VERSION"

  sca-dependency:
    name: SCA / Dependency
    needs: unit-tests
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy dependency scan and SBOM (on-premise Trivy)
        run: scripts/sca-scan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows evidence to leave the boundary.
        if: ${{ always() && vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: sbom-${{ env.RELEASE_KEY }}-${{ github.run_id }}
          path: target/sca
          retention-days: 90

  # Entering "test" is the Security Gate: the environment's protection rule
  # asks Helio, which waits for the signature before GitHub releases the job.
  deploy-to-test:
    name: Deploy to Test
    needs: [sast-scan, sca-dependency]
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: test
    concurrency:
      group: billing-api-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the TEST context
        env:
          TOMCAT_CONTEXT: billing-api-test
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  qa-automated-tests:
    name: QA Automated Tests
    needs: deploy-to-test
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: HTTP end-to-end tests against the TEST environment
        env:
          QA_TARGET_URL: ${{ env.ONPREM_TOMCAT }}/billing-api-test
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
        run: npm run qa

  # Entering "uat" is the CAB Approval gate.
  deploy-to-uat:
    name: Deploy to UAT
    needs: qa-automated-tests
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: uat
    concurrency:
      group: billing-api-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the UAT context
        env:
          TOMCAT_CONTEXT: billing-api-uat
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  policy-evaluation:
    name: Policy Evaluation
    needs: deploy-to-uat
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluate the release policy (on-premise OPA, facts from SonarQube, Trivy and UAT)
        run: |
          set -euo pipefail
          digest="$(curl --fail --silent --max-time 5 "$ONPREM_TOMCAT/billing-api-uat/artifact-digest")"
          scripts/opa-policy-check.sh "$digest" "$RELEASE_KEY" preprod "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        # Nexus is the system of record; copy to GitHub only when the
        # repository variable KEEP_GITHUB_ARTIFACTS allows evidence to leave the boundary.
        if: ${{ always() && vars.KEEP_GITHUB_ARTIFACTS == 'true' }}
        with:
          name: policy-decision-${{ env.RELEASE_KEY }}-${{ github.run_id }}
          path: target/policy
          retention-days: 90

  # Entering "preprod" is the App Owner Sign-off gate.
  deploy-to-preprod:
    name: Deploy to PreProd
    needs: policy-evaluation
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: preprod
    concurrency:
      group: billing-api-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Install the exact WAR into the PREPROD context
        env:
          TOMCAT_CONTEXT: billing-api-preprod
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}"

  smoke-and-perf-tests:
    name: Smoke + Perf Tests
    needs: deploy-to-preprod
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Smoke and measured p95 latency against PREPROD
        run: scripts/smoke-perf.sh "$ONPREM_TOMCAT/billing-api-preprod" "$RELEASE_VERSION"

  # Entering "production" is the Prod Release Gate (two signatures in Helio).
  # On a rollback (deployment_only=true) every job above is skipped and this
  # is the first job that runs, so it must tolerate skipped prerequisites but
  # never a failed or cancelled one.
  deploy-to-prod:
    name: Deploy to Prod
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [smoke-and-perf-tests, build-and-package]
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    environment: production
    # Publishing deployment evidence is a write; only this job may do it.
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate governed inputs
        if: inputs.helio_execution_id != ''
        env:
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
        run: |
          set -euo pipefail
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] \
            || { echo "helio_release_id is required on a governed run" >&2; exit 1; }
          [[ "$WORKFLOW_REVISION" == "$GITHUB_SHA" ]] \
            || { echo "workflow_revision '$WORKFLOW_REVISION' must equal the executing commit $GITHUB_SHA" >&2; exit 1; }
      - name: Resolve immutable release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve-artifact.sh "$RELEASE_KEY" "${{ inputs.artifact_digest }}" "$RELEASE_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Install exact WAR and restart the production context
        id: deploy
        env:
          TOMCAT_CONTEXT: billing-api
        run: scripts/deploy-tomcat.sh "${{ steps.artifact.outputs.artifact_digest }}" "${{ steps.artifact.outputs.package_path }}" | tee -a "$GITHUB_OUTPUT"

      - name: Bind serving WAR identity
        id: identity
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          DEPLOYED_VERSION: ${{ steps.deploy.outputs.deployed_version }}
        run: |
          set -euo pipefail
          echo "artifact_uri=billing-api-${DEPLOYED_VERSION}.war@${ARTIFACT_DIGEST}" >> "$GITHUB_OUTPUT"

      # Provider-authored, immutable record of what was deployed. Helio reads
      # this back rather than trusting its own dispatch. Only on a run Helio
      # started: a manual rehearsal has no release to bind to.
      - name: Publish immutable release deployment evidence
        if: inputs.helio_execution_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_URI: ${{ steps.identity.outputs.artifact_uri }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api-native.yml
          WORKFLOW_REVISION: ${{ github.sha }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          PRODUCTION_URL: http://127.0.0.1:8080/billing-api/
        run: |
          set -euo pipefail
          # Assert every field before publishing: a malformed record would be
          # read back as proof.
          [[ -n "$HELIO_EXECUTION_ID" ]]
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ROLLBACK_WORKFLOW_ID" =~ ^\.github/workflows/[A-Za-z0-9._/-]+\.ya?ml$ ]]
          [[ "$WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$DEPLOYMENT_ONLY" == "true" ]]; then
            deployment_task="helio-rollback"
          else
            deployment_task="helio-forward-release"
          fi

          jq -n \
            --arg ref "$GITHUB_SHA" \
            --arg execution_id "$HELIO_EXECUTION_ID" \
            --arg release_id "$HELIO_RELEASE_ID" \
            --arg artifact_uri "$ARTIFACT_URI" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" \
            --arg workflow_revision "$WORKFLOW_REVISION" \
            --arg task "$deployment_task" \
            '{ref:$ref, auto_merge:false, required_contexts:[],
              environment:"production", task:$task,
              payload:{schema_version:1,
                       helio_execution_id:$execution_id,
                       release_id:$release_id,
                       artifact_uri:$artifact_uri,
                       artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id,
                       workflow_revision:$workflow_revision}}' \
            > deployment-evidence.json

          deployment_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            --input deployment-evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success \
            -f description="Immutable WAR is serving from Apache Tomcat" \
            -f environment_url="$PRODUCTION_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact_digest }}

  post-deploy-verify:
    name: Post-Deploy Verify
    needs: deploy-to-prod
    runs-on: [self-hosted, "${{ vars.HELIO_RUNNER_LABEL || 'helio-tomcat' }}"]
    concurrency:
      group: billing-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify production serves the approved artifact
        env:
          EXPECTED_DIGEST: ${{ inputs.artifact_digest || needs.deploy-to-prod.outputs.artifact_digest }}
          EXPECTED_VERSION: ${{ env.RELEASE_VERSION }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
        run: |
          set -euo pipefail
          # A rollback redeploys an older version: verify the digest only.
          [[ "$DEPLOYMENT_ONLY" == "true" ]] && EXPECTED_VERSION=""
          scripts/verify-deployment.sh "$ONPREM_TOMCAT/billing-api" "$EXPECTED_DIGEST" "$EXPECTED_VERSION"
