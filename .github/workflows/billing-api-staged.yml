# Billing API (staged) — the full sixteen-stage Billing API pipeline, run
# stage by stage by Helio (Helio-managed mode), so a release can be restarted,
# resumed or backed out from the Release Orchestrator.
#
#   build → unit tests → SAST ‖ SCA → security gate → deploy test → QA tests
#   → CAB → deploy UAT → policy evaluation → app-owner sign-off
#   → deploy preprod → smoke/perf → prod release gate → deploy prod → verify
#
# Lightweight: every step runs on GitHub-hosted runners in seconds. The
# artifact is a deterministic archive of the commit, so any stage re-creates
# the same bytes and proves the same sha256 digest. Each deploy publishes a
# real GitHub deployment record, the evidence Helio reads back.
#
# Dispatch-only: Helio dispatches one stage per run (helio_stage_id); gates are
# decided in Helio and never run here. PreProd deploys to its own GitHub
# environment (preprod-staged): the repository's preprod environment is an
# Environment Catalog stage of the fan-out pipeline.
name: Billing API (staged)

run-name: ${{ inputs.helio_execution_id || format('Billing API (staged) - {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment of the release (informational)
        type: string
        required: false
        default: ''
      release_version:
        description: Helio release version being orchestrated
        required: false
        default: ''
      artifact_digest:
        description: Immutable sha256 digest to (re)deploy
        required: false
        default: ''
      workflow_revision:
        description: Commit SHA this deployment workflow is pinned to
        required: false
        default: ''
      deployment_only:
        description: '"true" when Helio redeploys an already-built artifact (rollback)'
        required: false
        default: 'false'
      helio_execution_id:
        description: Helio stage execution correlation id
        type: string
        required: false
        default: ''
      helio_release_id:
        description: Helio release UUID
        type: string
        required: false
        default: ''
      helio_stage_id:
        description: Immutable Helio logical stage id to execute
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  RELEASE_VERSION: ${{ inputs.release_version || format('v4.0.0-{0}', github.sha) }}
  RELEASE_KEY: ${{ inputs.helio_release_id || github.run_id }}

jobs:
  build-and-package:
    name: Build & Package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'build-and-package' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the commit deterministically
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=billing-api/ HEAD > dist/billing-api-staged.tar
          echo "Built Billing API $RELEASE_VERSION: sha256:$(sha256sum dist/billing-api-staged.tar | cut -d' ' -f1)"

  unit-tests:
    name: Unit Tests
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'unit-tests' }}
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Unit tests for $RELEASE_VERSION passed (412 tests)" && sleep 5

  sast-scan:
    name: SAST Scan
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'sast-scan' }}
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "SAST scan of $RELEASE_VERSION: 0 critical, 0 high" && sleep 5

  sca-dependency:
    name: SCA / Dependency
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'sca-dependency' }}
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Dependency scan of $RELEASE_VERSION: no known vulnerable components" && sleep 5

  security-gate:
    name: Security Gate
    if: ${{ github.event_name != 'workflow_dispatch' && success() }}
    needs: [sast-scan, sca-dependency]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Decided in Helio"

  deploy-to-test:
    name: Deploy to Test
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'deploy-to-test' }}
    needs: security-gate
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-staged-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: test
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api-staged.yml
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=billing-api/ HEAD > billing-api-staged.tar
          digest="sha256:$(sha256sum billing-api-staged.tar | cut -d' ' -f1)"
          if [[ -n "$EXPECTED_DIGEST" && "$EXPECTED_DIGEST" != "$digest" ]]; then
            echo "Artifact $digest differs from the approved $EXPECTED_DIGEST"; exit 1
          fi
          echo "Deploying Billing API $RELEASE_VERSION ($digest) to $TARGET_ENVIRONMENT"
          sleep 5
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Not a Helio release; no evidence published"; exit 0; }
          task=$([[ "$DEPLOYMENT_ONLY" == "true" ]] && echo helio-rollback || echo helio-forward-release)
          jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET_ENVIRONMENT" --arg task "$task" \
                --arg execution_id "$HELIO_EXECUTION_ID" --arg release_id "$HELIO_RELEASE_ID" \
                --arg artifact_uri "billing-api-staged-$RELEASE_VERSION.tar@$digest" --arg artifact_digest "$digest" \
                --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" --arg workflow_revision "$GITHUB_SHA" \
            '{ref:$ref, auto_merge:false, required_contexts:[], environment:$env, task:$task,
              payload:{schema_version:1, helio_execution_id:$execution_id, release_id:$release_id,
                       artifact_uri:$artifact_uri, artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id, workflow_revision:$workflow_revision}}' > evidence.json
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f description="Billing API $RELEASE_VERSION is serving in $TARGET_ENVIRONMENT" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  qa-automated-tests:
    name: QA Automated Tests
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'qa-automated-tests' }}
    needs: deploy-to-test
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "QA suite against test for $RELEASE_VERSION passed (86 scenarios)" && sleep 5

  cab-approval:
    name: CAB Approval
    if: ${{ github.event_name != 'workflow_dispatch' && success() }}
    needs: qa-automated-tests
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Decided in Helio"

  deploy-to-uat:
    name: Deploy to UAT
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'deploy-to-uat' }}
    needs: cab-approval
    runs-on: ubuntu-latest
    environment: uat
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-staged-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: uat
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api-staged.yml
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=billing-api/ HEAD > billing-api-staged.tar
          digest="sha256:$(sha256sum billing-api-staged.tar | cut -d' ' -f1)"
          if [[ -n "$EXPECTED_DIGEST" && "$EXPECTED_DIGEST" != "$digest" ]]; then
            echo "Artifact $digest differs from the approved $EXPECTED_DIGEST"; exit 1
          fi
          echo "Deploying Billing API $RELEASE_VERSION ($digest) to $TARGET_ENVIRONMENT"
          sleep 5
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Not a Helio release; no evidence published"; exit 0; }
          task=$([[ "$DEPLOYMENT_ONLY" == "true" ]] && echo helio-rollback || echo helio-forward-release)
          jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET_ENVIRONMENT" --arg task "$task" \
                --arg execution_id "$HELIO_EXECUTION_ID" --arg release_id "$HELIO_RELEASE_ID" \
                --arg artifact_uri "billing-api-staged-$RELEASE_VERSION.tar@$digest" --arg artifact_digest "$digest" \
                --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" --arg workflow_revision "$GITHUB_SHA" \
            '{ref:$ref, auto_merge:false, required_contexts:[], environment:$env, task:$task,
              payload:{schema_version:1, helio_execution_id:$execution_id, release_id:$release_id,
                       artifact_uri:$artifact_uri, artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id, workflow_revision:$workflow_revision}}' > evidence.json
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f description="Billing API $RELEASE_VERSION is serving in $TARGET_ENVIRONMENT" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  policy-evaluation:
    name: Policy Evaluation
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'policy-evaluation' }}
    needs: deploy-to-uat
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release policy evaluation for $RELEASE_VERSION: compliant" && sleep 5

  app-owner-signoff:
    name: App Owner Sign-off
    if: ${{ github.event_name != 'workflow_dispatch' && success() }}
    needs: policy-evaluation
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Decided in Helio"

  deploy-to-preprod:
    name: Deploy to PreProd
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'deploy-to-preprod' }}
    needs: app-owner-signoff
    runs-on: ubuntu-latest
    environment: preprod-staged
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-staged-preprod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: preprod-staged
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api-staged.yml
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=billing-api/ HEAD > billing-api-staged.tar
          digest="sha256:$(sha256sum billing-api-staged.tar | cut -d' ' -f1)"
          if [[ -n "$EXPECTED_DIGEST" && "$EXPECTED_DIGEST" != "$digest" ]]; then
            echo "Artifact $digest differs from the approved $EXPECTED_DIGEST"; exit 1
          fi
          echo "Deploying Billing API $RELEASE_VERSION ($digest) to $TARGET_ENVIRONMENT"
          sleep 5
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Not a Helio release; no evidence published"; exit 0; }
          task=$([[ "$DEPLOYMENT_ONLY" == "true" ]] && echo helio-rollback || echo helio-forward-release)
          jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET_ENVIRONMENT" --arg task "$task" \
                --arg execution_id "$HELIO_EXECUTION_ID" --arg release_id "$HELIO_RELEASE_ID" \
                --arg artifact_uri "billing-api-staged-$RELEASE_VERSION.tar@$digest" --arg artifact_digest "$digest" \
                --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" --arg workflow_revision "$GITHUB_SHA" \
            '{ref:$ref, auto_merge:false, required_contexts:[], environment:$env, task:$task,
              payload:{schema_version:1, helio_execution_id:$execution_id, release_id:$release_id,
                       artifact_uri:$artifact_uri, artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id, workflow_revision:$workflow_revision}}' > evidence.json
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f description="Billing API $RELEASE_VERSION is serving in $TARGET_ENVIRONMENT" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  smoke-and-perf-tests:
    name: Smoke + Perf Tests
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'smoke-and-perf-tests' }}
    needs: deploy-to-preprod
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Smoke and performance tests on preprod for $RELEASE_VERSION passed (p95 182 ms)" && sleep 5

  prod-release-gate:
    name: Prod Release Gate
    if: ${{ github.event_name != 'workflow_dispatch' && success() }}
    needs: smoke-and-perf-tests
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Decided in Helio"

  deploy-to-prod:
    name: Deploy to Prod
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.helio_stage_id == 'deploy-to-prod' || inputs.deployment_only == 'true') }}
    needs: [prod-release-gate, build-and-package]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
    concurrency:
      group: billing-api-staged-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          EXPECTED_DIGEST: ${{ inputs.artifact_digest }}
          DEPLOYMENT_ONLY: ${{ inputs.deployment_only }}
          ROLLBACK_WORKFLOW_ID: .github/workflows/billing-api-staged.yml
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=billing-api/ HEAD > billing-api-staged.tar
          digest="sha256:$(sha256sum billing-api-staged.tar | cut -d' ' -f1)"
          if [[ -n "$EXPECTED_DIGEST" && "$EXPECTED_DIGEST" != "$digest" ]]; then
            echo "Artifact $digest differs from the approved $EXPECTED_DIGEST"; exit 1
          fi
          echo "Deploying Billing API $RELEASE_VERSION ($digest) to $TARGET_ENVIRONMENT"
          sleep 5
          [[ "$HELIO_RELEASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Not a Helio release; no evidence published"; exit 0; }
          task=$([[ "$DEPLOYMENT_ONLY" == "true" ]] && echo helio-rollback || echo helio-forward-release)
          jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET_ENVIRONMENT" --arg task "$task" \
                --arg execution_id "$HELIO_EXECUTION_ID" --arg release_id "$HELIO_RELEASE_ID" \
                --arg artifact_uri "billing-api-staged-$RELEASE_VERSION.tar@$digest" --arg artifact_digest "$digest" \
                --arg rollback_workflow_id "$ROLLBACK_WORKFLOW_ID" --arg workflow_revision "$GITHUB_SHA" \
            '{ref:$ref, auto_merge:false, required_contexts:[], environment:$env, task:$task,
              payload:{schema_version:1, helio_execution_id:$execution_id, release_id:$release_id,
                       artifact_uri:$artifact_uri, artifact_digest:$artifact_digest,
                       rollback_workflow_id:$rollback_workflow_id, workflow_revision:$workflow_revision}}' > evidence.json
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
            -f description="Billing API $RELEASE_VERSION is serving in $TARGET_ENVIRONMENT" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  post-deploy-verify:
    name: Post-Deploy Verify
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.helio_stage_id == 'post-deploy-verify' }}
    needs: deploy-to-prod
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Production serves Billing API $RELEASE_VERSION; health checks green" && sleep 5
